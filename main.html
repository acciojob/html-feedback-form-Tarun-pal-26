<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Feedback Form Creation</title>
</head>
<body>

    <h1>Feedback Form</h1>

    <form method="post">
        <label for="name">Name</label>
        <input type="text" minlength="3" maxlength="50" id="name" required>

        <br><br>

        <label for="portfolio">Portfolio</label>
        <input type="url" id="portfolio" required>

        <br><br>

        <label for="favColor">Favorite Color</label>
        <input type="color" id="favColor">

        <br><br>

        <label for="likeness">Likeness</label>
        <input type="range" min="1" max="100" id="likeness">

        <br><br>

        <button type="submit">submit</button>

    </form>
</body>
</html>
